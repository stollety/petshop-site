<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro e Agendamento - PetShop Mundo Animal</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS externo -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">PetShop Mundo Animal</a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div id="menu" class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                <li class="nav-item"><a class="nav-link" href="produtos.html">Produtos</a></li>
                <li class="nav-item"><a class="nav-link" href="servicos.html">Serviços</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="text-center mb-4">Cadastro do Cliente e Agendamento</h2>

    <form id="formCadastro" class="p-4 border rounded bg-light">

        <!-- DADOS DO CLIENTE -->
        <h4 class="mb-3">Dados do Cliente</h4>

        <div class="row mb-3">
            <div class="col-md-6">
                <label for="nomeCliente" class="form-label">Nome completo*</label>
                <input type="text" class="form-control" id="nomeCliente" required placeholder="Digite seu nome">
            </div>

            <div class="col-md-3">
                <label for="cpf" class="form-label">CPF*</label>
                <input type="text" class="form-control" id="cpf" required maxlength="14" placeholder="000.000.000-00">
            </div>

            <div class="col-md-3">
                <label class="form-label d-block">Sexo*</label>
                <input type="radio" name="sexo" value="M" required> Masculino
                <input type="radio" name="sexo" value="F" required class="ms-3"> Feminino
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-8">
                <label for="endereco" class="form-label">Endereço*</label>
                <input type="text" class="form-control" id="endereco" placeholder="Rua, número, bairro" required>
            </div>

            <div class="col-md-4">
                <label for="telefone" class="form-label">Telefone*</label>
                <input type="tel" class="form-control" id="telefone" required placeholder="(11) 90000-0000">
            </div>
        </div>

        <div class="mb-4">
            <label for="email" class="form-label">E-mail*</label>
            <input type="email" class="form-control" id="email" placeholder="seuemail@exemplo.com" required>
        </div>

        <hr>

        <!-- DADOS DO PET -->
        <h4 class="mb-3">Dados do Pet</h4>

        <div class="row mb-3">
            <div class="col-md-4">
                <label for="nomePet" class="form-label">Nome do Pet*</label>
                <input type="text" class="form-control" id="nomePet" required placeholder="Ex: Rex">
            </div>

            <div class="col-md-4">
                <label for="raca" class="form-label">Raça*</label>
                <input type="text" class="form-control" id="raca" required placeholder="Ex: Poodle">
            </div>

            <div class="col-md-4">
                <label for="idadePet" class="form-label">Idade*</label>
                <input type="number" class="form-control" id="idadePet" required min="0" placeholder="Ex: 3">
            </div>
        </div>

        <hr>

        <!-- SERVIÇO -->
        <h4 class="mb-3">Serviço desejado</h4>

        <select id="servico" class="form-select mb-3" required>
            <option value="">Selecione um serviço</option>
            <option value="banho">Banho</option>
            <option value="tosa">Tosa</option>
        </select>

        <!-- MÉTODO -->
        <h4 class="mb-3">Método de agendamento</h4>

        <select id="metodo" class="form-select mb-3" required>
            <option value="">Selecione</option>
            <option value="tele-busca">Tele-busca</option>
            <option value="local">Entrega no local</option>
        </select>

        <!-- DATA E HORA -->
        <h4 class="mb-3">Data e horário do agendamento</h4>

        <div class="row mb-3">
            <div class="col-md-6">
                <label for="data" class="form-label">Data*</label>
                <input type="date" id="data" class="form-control" required>
            </div>

            <div class="col-md-6">
                <label for="hora" class="form-label">Horário*</label>
                <input type="time" id="hora" class="form-control" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary mt-3">Enviar Cadastro</button>
    </form>
</div>

<footer class="text-center mt-4 p-3 bg-light">
    © 2025 PetShop Mundo Animal
</footer>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- JS externo -->
<script src="js/script.js"></script>

</body>
</html>
